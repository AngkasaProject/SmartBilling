<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>Status Hotspot - Internet Aktif</title>
  <style>
    :root {
      --primary: #4f46e5;
      --emerald: #10b981;
      --bg: #090d16;
      --card: #131b2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 24px; width: 100%; max-width: 380px; padding: 28px 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center; }
    .status-icon { width: 64px; height: 64px; background: rgba(16, 185, 129, 0.15); border: 2px solid rgba(16, 185, 129, 0.4); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--emerald); font-size: 28px; margin-bottom: 12px; }
    h1 { font-size: 20px; font-weight: 800; }
    .user-pill { display: inline-block; background: #1e293b; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-family: monospace; color: #818cf8; margin: 8px 0 16px; }
    .stats-table { width: 100%; margin: 16px 0; border-collapse: collapse; font-size: 12px; text-align: left; background: #090d16; border-radius: 14px; overflow: hidden; border: 1px solid var(--card-border); }
    .stats-table td { padding: 10px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .stats-table tr:last-child td { border-bottom: none; }
    .stats-label { color: var(--text-muted); }
    .stats-val { text-align: right; font-weight: 700; font-family: monospace; }
    .btn-logout { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; border-radius: 14px; font-weight: 700; font-size: 13px; cursor: pointer; transition: background 0.2s; }
    .btn-logout:hover { background: rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-icon">✓</div>
    <h1>Terhubung ke Internet</h1>
    <div class="user-pill">User: $(username)</div>

    <table class="stats-table">
      <tr>
        <td class="stats-label">IP Address</td>
        <td class="stats-val">$(ip)</td>
      </tr>
      <tr>
        <td class="stats-label">Waktu Terhubung</td>
        <td class="stats-val">$(uptime)</td>
      </tr>
      $(if session-time-left)
      <tr>
        <td class="stats-label">Sisa Waktu</td>
        <td class="stats-val" style="color: #34d399;">$(session-time-left)</td>
      </tr>
      $(endif)
      <tr>
        <td class="stats-label">Download (Rx)</td>
        <td class="stats-val">$(bytes-out-nice)</td>
      </tr>
      <tr>
        <td class="stats-label">Upload (Tx)</td>
        <td class="stats-val">$(bytes-in-nice)</td>
      </tr>
    </table>

    <form action="$(link-logout)" name="logout" onSubmit="return openLogout()">
      <button type="submit" class="btn-logout">Logout (Putuskan Sesi)</button>
    </form>
  </div>
</body>
</html>
