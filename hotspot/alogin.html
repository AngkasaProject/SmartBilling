<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <meta http-equiv="refresh" content="2;url=$(link-redirect)">
  <meta name="theme-color" content="#f8fafc">
  <title>Login Berhasil - Hotspot WiFi</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f8fafc;
      --foreground: #09090b;
      --card: #fff;
      --muted: #f4f4f5;
      --muted-foreground: #71717a;
      --border: #e4e4e7;
      --primary: #18181b;
      --primary-foreground: #fafafa;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px calc(88px + env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% -12%, rgba(228, 228, 231, .75), transparent 48%), var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { -webkit-tap-highlight-color: transparent; }
    a:focus-visible { outline: 2px solid #a1a1aa; outline-offset: 3px; }
    .page { width: 100%; max-width: 430px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 32px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
    }
    .brand-mark img { width: 28px; height: 28px; object-fit: contain; }
    .brand-name { font-size: 14px; font-weight: 700; letter-spacing: -.02em; }
    .connection-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid #bbf7d0;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
      font-size: 11px;
      font-weight: 650;
    }
    .connection-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; }
    .card {
      padding: 25px 21px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 8px 24px rgba(24, 24, 27, .045), 0 1px 2px rgba(24, 24, 27, .04);
      text-align: center;
    }
    .icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 15px;
      place-items: center;
      border: 1px solid #bbf7d0;
      border-radius: 18px;
      background: var(--success-soft);
      color: var(--success);
    }
    h1 { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: -.04em; }
    .description { margin: 8px 0 0; color: var(--muted-foreground); font-size: 13px; }
    .account {
      display: inline-block;
      max-width: 100%;
      margin-top: 16px;
      padding: 7px 11px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fafafa;
      color: var(--foreground);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .redirect-note { margin: 17px 0 0; color: var(--muted-foreground); font-size: 12px; }
    .actions { display: grid; gap: 9px; margin-top: 18px; }
    .button {
      display: inline-flex;
      width: 100%;
      min-height: 45px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--card);
      color: var(--foreground);
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }
    .button:hover { background: var(--muted); }
    .button-primary { border-color: transparent; background: var(--primary); color: var(--primary-foreground); }
    .button-primary:hover { background: #27272a; }
    .bottom-nav {
      position: fixed;
      z-index: 5;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      width: min(100%, 430px);
      min-height: 68px;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      margin: 0 auto;
      padding: 8px 18px calc(8px + env(safe-area-inset-bottom));
      border: 1px solid rgba(228, 228, 231, .9);
      border-bottom: 0;
      border-radius: 18px 18px 0 0;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 -6px 22px rgba(24, 24, 27, .06);
      backdrop-filter: blur(14px);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted-foreground); font-size: 10px; font-weight: 600; text-decoration: none; }
    .nav-item.current { color: var(--foreground); }
    .nav-icon { display: grid; width: 23px; height: 23px; place-items: center; }
    @media (max-width: 360px) {
      body { padding-right: 12px; padding-left: 12px; }
      .card { padding: 20px 17px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="page" id="success">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">
          <img data-brand-logo alt="" hidden>
          <svg data-brand-fallback width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 9.5a11 11 0 0 1 14 0M8 12.5a6.5 6.5 0 0 1 8 0M10.8 15.5a2.1 2.1 0 0 1 2.4 0M12 19h.01"/>
          </svg>
        </span>
        <span class="brand-name" data-brand-name>WiFi Hotspot</span>
      </div>
      <span class="connection-pill"><span class="connection-dot"></span>Terhubung</span>
    </header>

    <section class="card" aria-labelledby="page-title">
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 12 4 4L19 6"/>
          <circle cx="12" cy="12" r="10"/>
        </svg>
      </div>
      <h1 id="page-title">Login berhasil</h1>
      <p class="description">Selamat berinternet, akun Anda sudah aktif.</p>
      <div class="account">$(username)</div>
      <p class="redirect-note">Anda akan dialihkan ke halaman yang diminta. Jika tidak berpindah otomatis:</p>

      <div class="actions">
        <a class="button button-primary" href="$(link-redirect)">
          Lanjutkan
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>
        <a class="button" href="$(link-status)">
          Lihat status koneksi
        </a>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi hotspot">
    <a class="nav-item current" href="$(link-status)" aria-current="page">
      <span class="nav-icon" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/>
        </svg>
      </span>
      Status
    </a>
    <a class="nav-item" href="https://BILLING_DOMAIN/?tab=voucher" data-portal-link>
      <span class="nav-icon" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 7h15l-1.5 9h-12zM6 7 5 3H2M9 20h.01M18 20h.01"/>
        </svg>
      </span>
      Beli paket
    </a>
  </nav>

  <script type="text/javascript" src="hotspot-config.js"></script>
</body>
</html>
