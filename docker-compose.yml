services:
  # MikroTik Billing & Hotspot Platform
  mikrotik-billing:
    build: .
    container_name: mikrotik-billing-app
    restart: unless-stopped
    ports:
      - "${BILLING_PORT:-1707}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      RUN_EXPRESS: "true"
      MIKROTIK_HOST: ${MIKROTIK_HOST:-}
      MIKROTIK_PORT: ${MIKROTIK_PORT:-8728}
      MIKROTIK_USER: ${MIKROTIK_USER:-}
      MIKROTIK_PASS: ${MIKROTIK_PASS:-}
      MIKROTIK_API_TYPE: ${MIKROTIK_API_TYPE:-api}
      MIKROTIK_TIMEOUT_SEC: ${MIKROTIK_TIMEOUT_SEC:-10}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      WA_PROVIDER: ${WA_PROVIDER:-}
      OPENWA_BASE_URL: ${OPENWA_BASE_URL:-}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID:-billing-isp}
      FONNTE_API_URL: ${FONNTE_API_URL:-https://api.fonnte.com/send}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      WA_SENDER_NUMBER: ${WA_SENDER_NUMBER:-}
    volumes:
      - billing_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  billing_data:
