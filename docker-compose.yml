services:
  mikrotik-billing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mikrotik-billing-app
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BILLING_PORT:-1707}:1707"
    environment:
      NODE_ENV: production
      RUN_EXPRESS: "true"
      PORT: "1707"
      TZ: ${TZ:-Asia/Jakarta}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MIKROTIK_HOST: ${MIKROTIK_HOST:-}
      MIKROTIK_PORT: ${MIKROTIK_PORT:-8728}
      MIKROTIK_USER: ${MIKROTIK_USER:-}
      MIKROTIK_PASS: ${MIKROTIK_PASS:-}
      MIKROTIK_API_TYPE: ${MIKROTIK_API_TYPE:-api}
      MIKROTIK_TIMEOUT_SEC: ${MIKROTIK_TIMEOUT_SEC:-10}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-}
      PAYMENT_WEBHOOK_URL: ${PAYMENT_WEBHOOK_URL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      WA_PROVIDER: ${WA_PROVIDER:-}
      OPENWA_BASE_URL: ${OPENWA_BASE_URL:-}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID:-billing-isp}
      FONNTE_API_URL: ${FONNTE_API_URL:-https://api.fonnte.com/send}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      WA_BULK_DELAY_MS: ${WA_BULK_DELAY_MS:-3000}
      WA_SENDER_NUMBER: ${WA_SENDER_NUMBER:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - billing_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:1707/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  billing_data:
